name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # windows-latest, not ubuntu-latest, because it is the only runner that builds every slice the
    # libraries ship. Directory.Build.props drops net10.0-ios and net10.0-maccatalyst on Linux and
    # net10.0-windows10.0.19041.0 everywhere but Windows, so a Linux job would build two target
    # frameworks per library instead of five and MultiTargetingTests would dutifully pass while
    # covering less than half of what is published.
    #
    # The iOS and Mac Catalyst *library* slices compile fine here; only building and signing an app
    # for them needs a Mac.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Reads the solution and installs exactly the workloads its target frameworks need, rather
      # than a hardcoded list that would drift from Directory.Build.props.
      - name: Install MAUI workloads
        run: dotnet workload restore Me.Toolkit.Maui.slnx

      # The projects are named rather than building the solution, because DemoApp is in the solution
      # and deliberately out of CI: it is an app, it builds far slower than a library, and nothing in
      # it ships. The cost is that this list has to be kept in step with the libraries, which
      # MultiTargetingTests will notice, since it enumerates them.
      #
      # -warnaserror is the zero-warning bar, and also turns a new NuGet advisory (NU1902/NU1904)
      # into a build failure. That could not be set while legacy/ existed.
      - name: Build libraries
        shell: pwsh
        run: |
          foreach ($project in 'Me.Toolkit.Maui.Configuration','Me.Toolkit.Maui.Hosting','Me.Toolkit.Maui.Nfc','Me.Toolkit.Maui.WebHostPatch') {
            dotnet build "$project/$project.csproj" --configuration Release -warnaserror
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The build above is not just a prerequisite for the tests: PublicApiSurfaceTests and
      # MultiTargetingTests read the libraries' compiled assemblies off disk through
      # MetadataLoadContext rather than referencing them, so every slice must have been built in
      # this configuration before the tests run.
      #
      # Runs on Microsoft.Testing.Platform via the test.runner setting in global.json.
      #
      # Do not add --nologo, -warnaserror, or any other flag MTP does not know: it forwards
      # unrecognised arguments to the test executable, which exits 5 having run nothing. That was
      # not hypothetical here - the first version of this step passed -warnaserror and reported
      # "total: 0". It fails the job rather than passing silently, but it tests nothing.
      - name: Test
        run: dotnet test --project Me.Toolkit.Maui.Tests/Me.Toolkit.Maui.Tests.csproj --configuration Release
